<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethiopian Premier Fantasy Pitch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Bar -->
  <header class="app-header">
    <h1 class="brand-title">Ethiopian Premier League Fantasy</h1>
    <div id="formation-badge" class="formation-badge">Formation: 4-4-2</div>
  </header>

  <!-- Notification Banner -->
  <div id="status-banner" class="status-banner" aria-live="polite"></div>

  <!-- Main Pitch Container -->
  <main class="pitch-container">
    <div class="pitch-field">
      <!-- Pitch Marking Graphics -->
      <div class="pitch-box top-box"></div>
      <div class="pitch-circle"></div>
      <div class="pitch-half-line"></div>
      <div class="pitch-box bottom-box"></div>

      <!-- Positional Pitch Rows -->
      <div id="row-gkp" class="pitch-row"></div>
      <div id="row-def" class="pitch-row"></div>
      <div id="row-mid" class="pitch-row"></div>
      <div id="row-fwd" class="pitch-row"></div>
    </div>
  </main>

  <!-- Bench / Substitutes Section -->
  <section class="bench-container">
    <h2 class="bench-label">Substitutes</h2>
    <div id="row-bench" class="bench-row"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
