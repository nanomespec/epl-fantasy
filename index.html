<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethio Premier Fantasy - Phase 1 Pitch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #1a1a24; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    
    .header { width: 100%; max-width: 800px; text-align: center; margin-bottom: 15px; }
    .header h1 { color: #00ff87; margin-bottom: 5px; }
    .formation-badge { display: inline-block; background: #38003c; color: #00ff87; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; }

    .status-msg { width: 100%; max-width: 800px; padding: 10px; margin-bottom: 15px; border-radius: 6px; text-align: center; font-weight: 600; display: none; }
    .status-msg.error { background: #ff4757; color: #fff; display: block; }
    .status-msg.success { background: #2ed573; color: #000; display: block; }

    /* Visual Pitch Styling */
    .pitch-container { width: 100%; max-width: 800px; background: linear-gradient(180deg, #118140 0%, #0c6130 100%); border-radius: 12px; border: 3px solid #2ed573; padding: 20px 10px; display: flex; flex-direction: column; gap: 20px; min-height: 520px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .pitch-line { display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; }

    /* Bench Container */
    .bench-container { width: 100%; max-width: 800px; background: #242432; border-radius: 12px; padding: 15px; margin-top: 15px; }
    .bench-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 10px; text-align: center; }
    .bench-line { display: flex; justify-content: space-around; align-items: center; }

    /* Player Cards */
    .player-card { background: rgba(255, 255, 255, 0.95); color: #111; width: 110px; border-radius: 8px; padding: 8px 4px; text-align: center; cursor: pointer; transition: all 0.2s ease; position: relative; user-select: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .player-card:hover { transform: translateY(-4px); box-shadow: 0 8px 15px rgba(0,0,0,0.4); }
    .player-card.selected { border: 3px solid #00ff87; background: #e0ffb3; transform: scale(1.05); }

    .position-tag { font-size: 0.7rem; font-weight: bold; color: #555; text-transform: uppercase; }
    .player-name { font-size: 0.85rem; font-weight: bold; margin: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .role-badge { position: absolute; top: -6px; right: -6px; background: #38003c; color: #00ff87; border-radius: 50%; width: 22px; height: 22px; font-size: 0.75rem; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 1px solid #00ff87; }
    
    .card-actions { display: flex; justify-content: center; gap: 4px; margin-top: 4px; }
    .btn-badge { background: #38003c; color: #fff; border: none; padding: 2px 5px; font-size: 0.65rem; border-radius: 3px; cursor: pointer; font-weight: bold; }
    .btn-badge:hover { background: #00ff87; color: #38003c; }

    .controls-panel { margin-top: 20px; display: flex; gap: 10px; }
    .action-btn { background: #00ff87; color: #38003c; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .action-btn:hover { background: #00cc6a; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Ethio Premier Fantasy</h1>
    <div id="formation-badge" class="formation-badge">Formation: 4-4-2</div>
  </div>

  <div id="status-msg" class="status-msg"></div>

  <div class="pitch-container">
    <div id="pitch-gkp" class="pitch-line"></div>
    <div id="pitch-def" class="pitch-line"></div>
    <div id="pitch-mid" class="pitch-line"></div>
    <div id="pitch-fwd" class="pitch-line"></div>
  </div>

  <div class="bench-container">
    <div class="bench-title">Bench (Order: GKP | Bench 1 | Bench 2 | Bench 3)</div>
    <div id="bench-line" class="bench-line"></div>
  </div>

  <div class="controls-panel">
    <button id="btn-auto-sub" class="action-btn">Simulate Gameweek Auto-Subs</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
