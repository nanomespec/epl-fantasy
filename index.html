<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethio Premier Fantasy - Squad Pitch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121218;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Top Navigation Header */
    .header {
      width: 100%;
      max-width: 850px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding: 0 10px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #00ff87;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .formation-badge {
      background: #38003c;
      color: #00ff87;
      border: 1px solid #00ff87;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    /* Notification Banner */
    .status-banner {
      width: 100%;
      max-width: 850px;
      padding: 10px 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    .status-banner.error {
      background: #ff4757;
      color: #fff;
      display: block;
    }

    .status-banner.success {
      background: #2ed573;
      color: #000;
      display: block;
    }

    /* Main Pitch Graphics */
    .pitch-wrapper {
      width: 100%;
      max-width: 850px;
      position: relative;
    }

    .pitch-field {
      width: 100%;
      min-height: 620px;
      background: repeating-linear-gradient(
        0deg,
        #117a3f,
        #117a3f 50px,
        #0d6834 50px,
        #0d6834 100px
      );
      border-radius: 12px;
      border: 4px solid #2ed573;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      padding: 20px 10px;
      overflow: hidden;
    }

    /* Tactical Markings */
    .pitch-line-center {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%);
    }

    .pitch-circle-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120px;
      height: 120px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .pitch-box-top {
      position: absolute;
      top: 0;
      left: 50%;
      width: 220px;
      height: 90px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top: none;
      transform: translateX(-50%);
    }

    .pitch-box-bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 220px;
      height: 90px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-bottom: none;
      transform: translateX(-50%);
    }

    /* Pitch Rows */
    .pitch-row {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      min-height: 110px;
    }

    /* Bench Container */
    .bench-wrapper {
      width: 100%;
      max-width: 850px;
      background: #1e1e2a;
      border-radius: 12px;
      border: 1px solid #333348;
      padding: 16px;
      margin-top: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .bench-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #9a9ab0;
      text-align: center;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .bench-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
    }

    /* Player Card Styling */
    .player-card {
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      width: 105px;
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      user-select: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .player-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
    }

    .player-card.selected {
      border: 3px solid #00ff87;
      background: #e0ffb3;
      transform: scale(1.05);
    }

    .position-tag {
      font-size: 0.68rem;
      font-weight: 800;
      color: #555;
      text-transform: uppercase;
    }

    .player-name {
      font-size: 0.82rem;
      font-weight: 700;
      margin: 3px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .role-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #38003c;
      color: #00ff87;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 0.75rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #00ff87;
    }

    .card-actions {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 4px;
    }

    .btn-badge {
      background: #38003c;
      color: #fff;
      border: none;
      padding: 2px 6px;
      font-size: 0.65rem;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-badge:hover {
      background: #00ff87;
      color: #38003c;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="header">
    <div class="brand-title">Ethio Premier Fantasy</div>
    <div id="formation-badge" class="formation-badge">Formation: 4-4-2</div>
  </div>

  <!-- Status Banner -->
  <div id="status-banner" class="status-banner"></div>

  <!-- Pitch Graphics -->
  <div class="pitch-wrapper">
    <div class="pitch-field">
      <div class="pitch-box-top"></div>
      <div class="pitch-circle-center"></div>
      <div class="pitch-line-center"></div>
      <div class="pitch-box-bottom"></div>

      <div id="pitch-gkp" class="pitch-row"></div>
      <div id="pitch-def" class="pitch-row"></div>
      <div id="pitch-mid" class="pitch-row"></div>
      <div id="pitch-fwd" class="pitch-row"></div>
    </div>
  </div>

  <!-- Bench Graphics -->
  <div class="bench-wrapper">
    <div class="bench-label">Substitutes</div>
    <div id="bench-row" class="bench-row"></div>
  </div>

  <script>
    // Squad Data Definition
    const initialSquad = {
      starters: [
        { id: 1, name: "Raya", position: "GKP", isCaptain: false, isViceCaptain: false },
        { id: 2, name: "Gabriel", position: "DEF", isCaptain: false, isViceCaptain: false },
        { id: 3, name: "Saliba", position: "DEF", isCaptain: false, isViceCaptain: false },
        { id: 4, name: "Trent A.A.", position: "DEF", isCaptain: false, isViceCaptain: false },
        { id: 5, name: "Gvardiol", position: "DEF", isCaptain: false, isViceCaptain: false },
        { id: 6, name: "Saka", position: "MID", isCaptain: true, isViceCaptain: false },
        { id: 7, name: "Palmer", position: "MID", isCaptain: false, isViceCaptain: true },
        { id: 8, name: "Salah", position: "MID", isCaptain: false, isViceCaptain: false },
        { id: 9, name: "Gordon", position: "MID", isCaptain: false, isViceCaptain: false },
        { id: 10, name: "Haaland", position: "FWD", isCaptain: false, isViceCaptain: false },
        { id: 11, name: "Watkins", position: "FWD", isCaptain: false, isViceCaptain: false }
      ],
      bench: [
        { id: 12, name: "Neto", position: "GKP", isCaptain: false, isViceCaptain: false },
        { id: 13, name: "Rogers", position: "MID", isCaptain: false, isViceCaptain: false },
        { id: 14, name: "Konsa", position: "DEF", isCaptain: false, isViceCaptain: false },
        { id: 15, name: "Joao Pedro", position: "FWD", isCaptain: false, isViceCaptain: false }
      ]
    };

    // Manager Logic & Validation Rules
    class SquadManager {
      constructor(squad) {
        this.squad = squad;
        this.rules = { GKP: 1, DEF_MIN: 3, DEF_MAX: 5, MID_MIN: 2, MID_MAX: 5, FWD_MIN: 1, FWD_MAX: 3, TOTAL: 11 };
      }

      getFormation() {
        const counts = { DEF: 0, MID: 0, FWD: 0 };
        this.squad.starters.forEach(p => { if (counts[p.position] !== undefined) counts[p.position]++; });
        return `${counts.DEF}-${counts.MID}-${counts.FWD}`;
      }

      validateFormation(starters) {
        const counts = starters.reduce((acc, p) => {
          acc[p.position] = (acc[p.position] || 0) + 1;
          return acc;
        }, { GKP: 0, DEF: 0, MID: 0, FWD: 0 });

        if (counts.GKP !== 1) return { valid: false, reason: "Lineup must have exactly 1 Goalkeeper." };
        if (counts.DEF < 3 || counts.DEF > 5) return { valid: false, reason: "Lineup must have 3 to 5 Defenders." };
        if (counts.MID < 2 || counts.MID > 5) return { valid: false, reason: "Lineup must have 2 to 5 Midfielders." };
        if (counts.FWD < 1 || counts.FWD > 3) return { valid: false, reason: "Lineup must have 1 to 3 Forwards." };

        return { valid: true };
      }

      swap(starterId, benchId) {
        const starters = [...this.squad.starters];
        const bench = [...this.squad.bench];

        const sIdx = starters.findIndex(p => p.id === starterId);
        const bIdx = bench.findIndex(p => p.id === benchId);

        if (sIdx === -1 || bIdx === -1) return { success: false, reason: "Player not found." };

        const testStarters = [...starters];
        testStarters[sIdx] = bench[bIdx];

        const check = this.validateFormation(testStarters);
        if (!check.valid) return { success: false, reason: check.reason };

        const temp = starters[sIdx];
        starters[sIdx] = bench[bIdx];
        bench[bIdx] = temp;

        this.squad = { starters, bench };
        return { success: true };
      }

      setRole(playerId, role) {
        let cap = this.squad.starters.find(p => p.isCaptain)?.id;
        let vice = this.squad.starters.find(p => p.isViceCaptain)?.id;

        if (role === 'C') {
          cap = playerId;
          if (vice === playerId) vice = null;
        } else if (role === 'VC') {
          vice = playerId;
          if (cap === playerId) cap = null;
        }

        this.squad.starters = this.squad.starters.map(p => ({
          ...p,
          isCaptain: p.id === cap,
          isViceCaptain: p.id === vice
        }));
      }
    }

    // UI Renderer
    class PitchRenderer {
      constructor(manager) {
        this.manager = manager;
        this.selected = null;
      }

      init() {
        this.render();
      }

      showBanner(msg, type = 'error') {
        const banner = document.getElementById('status-banner');
        banner.className = `status-banner ${type}`;
        banner.textContent = msg;
        setTimeout(() => { banner.className = 'status-banner'; }, 3500);
      }

      handleSelect(player, isStarter) {
        if (!this.selected) {
          this.selected = { player, isStarter };
          this.render();
          return;
        }

        if (this.selected.isStarter === isStarter) {
          this.selected = { player, isStarter };
          this.render();
          return;
        }

        const starterId = this.selected.isStarter ? this.selected.player.id : player.id;
        const benchId = this.selected.isStarter ? player.id : this.selected.player.id;

        const res = this.manager.swap(starterId, benchId);
        if (!res.success) {
          this.showBanner(res.reason, 'error');
        }

        this.selected = null;
        this.render();
      }

      createCard(player, isStarter) {
        const card = document.createElement('div');
        const isSelected = this.selected && this.selected.player.id === player.id;
        card.className = `player-card ${isSelected ? 'selected' : ''}`;

        let badge = '';
        if (player.isCaptain) badge = '<div class="role-badge">C</div>';
        if (player.isViceCaptain) badge = '<div class="role-badge">VC</div>';

        let actions = '';
        if (isStarter) {
          actions = `
            <div class="card-actions">
              <button class="btn-badge btn-c">C</button>
              <button class="btn-badge btn-vc">VC</button>
            </div>
          `;
        }

        card.innerHTML = `
          ${badge}
          <div class="position-tag">${player.position}</div>
          <div class="player-name">${player.name}</div>
          ${actions}
        `;

        card.addEventListener('click', (e) => {
          if (e.target.classList.contains('btn-c')) {
            e.stopPropagation();
            this.manager.setRole(player.id, 'C');
            this.render();
          } else if (e.target.classList.contains('btn-vc')) {
            e.stopPropagation();
            this.manager.setRole(player.id, 'VC');
            this.render();
          } else {
            this.handleSelect(player, isStarter);
          }
        });

        return card;
      }

      render() {
        document.getElementById('formation-badge').textContent = `Formation: ${this.manager.getFormation()}`;

        const lines = {
          GKP: document.getElementById('pitch-gkp'),
          DEF: document.getElementById('pitch-def'),
          MID: document.getElementById('pitch-mid'),
          FWD: document.getElementById('pitch-fwd'),
          BENCH: document.getElementById('bench-row')
        };

        Object.values(lines).forEach(el => el.innerHTML = '');

        this.manager.squad.starters.forEach(p => {
          if (lines[p.position]) {
            lines[p.position].appendChild(this.createCard(p, true));
          }
        });

        this.manager.squad.bench.forEach(p => {
          lines.BENCH.appendChild(this.createCard(p, false));
        });
      }
    }

    // Initialize App
    document.addEventListener('DOMContentLoaded', () => {
      const manager = new SquadManager(initialSquad);
      const renderer = new PitchRenderer(manager);
      renderer.init();
    });
  </script>
</body>
</html>
