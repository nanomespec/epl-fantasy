<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPL Fantasy Squad Pitch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121218;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Top Navigation Header */
    .header {
      width: 100%;
      max-width: 850px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 10px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #00ff87;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .formation-badge {
      background: #38003c;
      color: #00ff87;
      border: 1px solid #00ff87;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    /* Notification / Message Banner */
    .status-banner {
      width: 100%;
      max-width: 850px;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    /* Main Pitch Graphics */
    .pitch-wrapper {
      width: 100%;
      max-width: 850px;
      position: relative;
    }

    .pitch-field {
      width: 100%;
      min-height: 620px;
      background: repeating-linear-gradient(
        0deg,
        #117a3f,
        #117a3f 50px,
        #0d6834 50px,
        #0d6834 100px
      );
      border-radius: 12px;
      border: 4px solid #2ed573;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 15px;
      overflow: hidden;
    }

    /* Tactical Line Markings */
    .pitch-line-center {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%);
    }

    .pitch-circle-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120px;
      height: 120px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .pitch-box-top {
      position: absolute;
      top: 0;
      left: 50%;
      width: 220px;
      height: 90px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top: none;
      transform: translateX(-50%);
    }

    .pitch-box-bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 220px;
      height: 90px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-bottom: none;
      transform: translateX(-50%);
    }

    /* Pitch Rows (Position Lines) */
    .pitch-row {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      min-height: 110px;
    }

    /* Bench Section */
    .bench-wrapper {
      width: 100%;
      max-width: 850px;
      background: #1e1e2a;
      border-radius: 12px;
      border: 1px solid #333348;
      padding: 16px;
      margin-top: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .bench-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #9a9ab0;
      text-align: center;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .bench-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
    }

    /* Card Slots Graphics */
    .slot {
      width: 100px;
      height: 110px;
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
    }

    .slot-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="header">
    <div class="brand-title">Ethio Premier Fantasy</div>
    <div id="formation-badge" class="formation-badge">Formation: --</div>
  </div>

  <!-- Message Banner -->
  <div id="status-banner" class="status-banner"></div>

  <!-- Main Pitch Field Graphic -->
  <div class="pitch-wrapper">
    <div class="pitch-field">
      <!-- Pitch Markings -->
      <div class="pitch-box-top"></div>
      <div class="pitch-circle-center"></div>
      <div class="pitch-line-center"></div>
      <div class="pitch-box-bottom"></div>

      <!-- Player Lines -->
      <div id="pitch-gkp" class="pitch-row">
        <div class="slot"><span class="slot-title">GKP</span></div>
      </div>
      <div id="pitch-def" class="pitch-row">
        <div class="slot"><span class="slot-title">DEF</span></div>
        <div class="slot"><span class="slot-title">DEF</span></div>
        <div class="slot"><span class="slot-title">DEF</span></div>
        <div class="slot"><span class="slot-title">DEF</span></div>
      </div>
      <div id="pitch-mid" class="pitch-row">
        <div class="slot"><span class="slot-title">MID</span></div>
        <div class="slot"><span class="slot-title">MID</span></div>
        <div class="slot"><span class="slot-title">MID</span></div>
        <div class="slot"><span class="slot-title">MID</span></div>
      </div>
      <div id="pitch-fwd" class="pitch-row">
        <div class="slot"><span class="slot-title">FWD</span></div>
        <div class="slot"><span class="slot-title">FWD</span></div>
      </div>
    </div>
  </div>

  <!-- Bench Graphics -->
  <div class="bench-wrapper">
    <div class="bench-label">Substitutes</div>
    <div id="bench-row" class="bench-row">
      <div class="slot"><span class="slot-title">GKP (Sub)</span></div>
      <div class="slot"><span class="slot-title">Sub 1</span></div>
      <div class="slot"><span class="slot-title">Sub 2</span></div>
      <div class="slot"><span class="slot-title">Sub 3</span></div>
    </div>
  </div>

</body>
</html>
