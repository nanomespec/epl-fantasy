<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethiopian Premier League Fantasy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top App Bar -->
  <header class="fpl-header">
    <div class="header-container">
      <div class="brand-info">
        <span class="league-tag">ETHIOPIAN PREMIER LEAGUE</span>
        <h1 class="brand-title">Fantasy Squad</h1>
      </div>
      <div class="squad-info">
        <div id="formation-badge" class="info-pill">Formation: 4-4-2</div>
        <div id="bank-badge" class="info-pill highlight">Bank: 1.0m</div>
      </div>
    </div>
  </header>

  <!-- Status Notification Banner -->
  <div id="status-banner" class="status-banner" aria-live="polite"></div>

  <main class="fpl-main">
    <!-- Pitch Section -->
    <div class="pitch-container">
      
      <!-- Top Pitch Bar (Stats Summary) -->
      <div class="pitch-header-bar">
        <div class="pitch-stat">
          <span class="label">GW Gameweek</span>
          <span class="value">GW 1</span>
        </div>
        <div class="pitch-stat">
          <span class="label">Free Transfers</span>
          <span class="value">1</span>
        </div>
        <div class="pitch-stat">
          <span class="label">Cost</span>
          <span class="value">0 pts</span>
        </div>
      </div>

      <!-- Main Field Canvas -->
      <div class="pitch-field">
        <div class="pitch-markings">
          <div class="penalty-box top"></div>
          <div class="center-circle"></div>
          <div class="halfway-line"></div>
          <div class="penalty-box bottom"></div>
        </div>

        <!-- Starting 11 Positional Rows -->
        <div id="row-gkp" class="pitch-row"></div>
        <div id="row-def" class="pitch-row"></div>
        <div id="row-mid" class="pitch-row"></div>
        <div id="row-fwd" class="pitch-row"></div>
      </div>

      <!-- Bench Dugout Container -->
      <div class="bench-container">
        <div class="bench-header">
          <span class="bench-title">Substitutes</span>
        </div>
        <div id="row-bench" class="bench-row"></div>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
