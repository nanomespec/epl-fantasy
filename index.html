<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPL Fantasy — Version 2</title>
  <style>
    :root{
      --bg:#071322;
      --bg2:#0a1930;
      --panel:#0f1d2d;
      --line: rgba(255,255,255,0.08);
      --text:#edf6ff;
      --muted:#afc1d9;
      --accent:#5f3db9;
      --accent2:#7a5ce4;
      --green1:#0d3a26;
      --green2:#145a37;
      --danger:#d54a4a;
      --shadow:0 18px 40px rgba(0,0,0,0.4);
      --radius:14px;
    }

    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      min-height:100%;
      background:linear-gradient(180deg,var(--bg),var(--bg2));
      color:var(--text);
      font-family:Inter,Segoe UI,Arial,sans-serif;
    }

    body{
      padding:18px;
    }

    #app{
      max-width:1320px;
      margin:0 auto;
    }

    .shell{
      background:rgba(255,255,255,0.02);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .topbar{
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      padding:14px 18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:800;
      font-size:1.1rem;
    }

    .gw-pill{
      background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:999px;
      padding:6px 10px;
      font-size:0.7rem;
      font-weight:700;
    }

    .topstats{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .sticker{
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:8px;
      padding:7px 10px;
      font-size:0.76rem;
    }

    .tabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      padding:10px 18px 0;
      background:rgba(255,255,255,0.02);
      border-bottom:1px solid var(--line);
    }

    .tab-btn{
      padding:10px 14px;
      border:1px solid rgba(255,255,255,0.05);
      border-radius:10px 10px 0 0;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
      font-weight:600;
    }

    .tab-btn.active{
      background:rgba(255,255,255,0.03);
      color:var(--text);
    }

    .content{
      padding:18px;
    }

    .layout{
      display:grid;
      grid-template-columns:minmax(0,1.7fr) minmax(300px,420px);
      gap:18px;
      align-items:start;
    }

    .panel{
      background:rgba(255,255,255,0.02);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:14px;
    }

    .card-title{
      margin:0 0 12px;
      font-size:1rem;
      font-weight:700;
    }

    .chip-strip{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:12px;
    }

    .chip{
      border-radius:999px;
      background:rgba(255,255,255,0.02);
      color:var(--text);
      border:1px solid rgba(255,255,255,0.05);
      padding:6px 10px;
      font-size:0.72rem;
      cursor:pointer;
    }

    .chip.active{
      background:#fff;
      color:#071322;
      font-weight:700;
    }

    .pitch-wrap{
      background:linear-gradient(180deg,var(--green1),var(--green2));
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.05);
      min-height:430px;
      padding:14px;
      position:relative;
      overflow:hidden;
    }

    .pitch-wrap::before{
      content:"";
      position:absolute;
      inset:12px;
      border:1px solid rgba(255,255,255,0.06);
      border-radius:8px;
      pointer-events:none;
    }

    .pitch-wrap::after{
      content:"";
      position:absolute;
      left:50%;
      top:10%;
      bottom:10%;
      width:2px;
      background:rgba(255,255,255,0.06);
      transform:translateX(-50%);
      pointer-events:none;
    }

    .pitch-row{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      position:relative;
      z-index:1;
      margin-bottom:10px;
    }

    .player-card{
      width:146px;
      min-height:96px;
      border-radius:10px;
      padding:8px;
      background:rgba(10,17,27,0.38);
      border:1px solid rgba(255,255,255,0.06);
      box-shadow:0 12px 20px rgba(0,0,0,0.18);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .player-card.empty{
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(255,255,255,0.35);
      background:rgba(255,255,255,0.02);
      border-style:dashed;
    }

    .player-name{
      font-size:0.83rem;
      font-weight:700;
      line-height:1.25;
    }

    .player-meta{
      font-size:0.72rem;
      color:var(--muted);
    }

    .player-actions{
      display:flex;
      gap:4px;
      flex-wrap:wrap;
      margin-top:4px;
    }

    .button{
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.02);
      color:var(--text);
      padding:6px 8px;
      border-radius:8px;
      cursor:pointer;
      font-size:0.72rem;
    }

    .button.primary{
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      border:none;
      box-shadow:0 10px 18px rgba(102,77,190,0.3);
    }

    .button.danger{
      background:linear-gradient(90deg,#d65252,#b82d2d);
      border:none;
    }

    .bench{
      margin-top:14px;
      padding-top:12px;
      border-top:1px solid rgba(255,255,255,0.05);
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      position:relative;
      z-index:1;
    }

    .bench-player{
      background:rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.05);
      border-radius:8px;
      padding:6px 8px;
      font-size:0.72rem;
    }

    .summary-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:6px 0;
      color:var(--muted);
      font-size:0.8rem;
    }

    .summary-row strong{
      color:var(--text);
    }

    .squad-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:10px;
    }

    .squad-card{
      background:rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.05);
      border-radius:10px;
      padding:10px;
    }

    .search-row{
      display:flex;
      gap:8px;
      align-items:center;
      margin-bottom:12px;
      flex-wrap:wrap;
    }

    .search{
      flex:1;
      min-width:180px;
      padding:9px 10px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.07);
      background:rgba(255,255,255,0.02);
      color:var(--text);
    }

    .filter-btn{
      padding:7px 10px;
      border:1px solid rgba(255,255,255,0.05);
      background:transparent;
      color:var(--muted);
      border-radius:8px;
      cursor:pointer;
    }

    .filter-btn.active{
      background:rgba(255,255,255,0.03);
      color:var(--text);
      font-weight:700;
    }

    .market-list{
      display:flex;
      flex-direction:column;
      gap:8px;
      max-height:520px;
      overflow:auto;
    }

    .market-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px;
      border-radius:10px;
      background:rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.04);
      flex-wrap:wrap;
    }

    .market-left{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .avatar{
      width:42px;
      height:42px;
      border-radius:50%;
      background:rgba(255,255,255,0.04);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      flex-shrink:0;
    }

    .pending-list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .pending-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:8px 10px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.04);
      background:rgba(255,255,255,0.02);
    }

    .modal-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.52);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:50;
      padding:18px;
    }

    .modal{
      background:linear-gradient(180deg,#0c1420,#071321);
      border:1px solid rgba(255,255,255,0.06);
      border-radius:12px;
      box-shadow:0 25px 50px rgba(0,0,0,0.45);
      width:min(760px,100%);
      padding:14px;
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:8px;
    }

    .modal-body{
      max-height:72vh;
      overflow:auto;
      padding-right:4px;
    }

    .modal-actions{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:12px;
    }

    textarea{
      width:100%;
      min-height:150px;
      resize:vertical;
      border-radius:10px;
      padding:10px;
      border:1px solid rgba(255,255,255,0.05);
      background:rgba(255,255,255,0.02);
      color:var(--text);
    }

    @media (max-width:980px){
      .layout{ grid-template-columns:1fr; }
      body{ padding:12px; }
      .topbar{ align-items:flex-start; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const PLAYERS = [
      { id:1, name:"Abebe Tilahun", pos:"GK", club:"St. George", price:4.5, points:28, bio:"Reliable keeper." },
      { id:2, name:"Bahiru Negash", pos:"GK", club:"Ethiopia Bunna", price:4.5, points:24, bio:"Agile shot-stopper." },
      { id:3, name:"Aschalew Tamene", pos:"DEF", club:"Fasil Kenema", price:5.0, points:42, bio:"Ball-playing center back." },
      { id:4, name:"Yared Bayeh", pos:"DEF", club:"Bahir Dar", price:5.0, points:38, bio:"Strong in duels." },
      { id:5, name:"Suleman Hamid", pos:"DEF", club:"St. George", price:4.5, points:31, bio:"Attacking fullback." },
      { id:6, name:"Henok Gebre", pos:"DEF", club:"Ethiopia Bunna", price:4.5, points:29, bio:"Consistent starter." },
      { id:7, name:"Ramkel Lok", pos:"DEF", club:"EEPCO", price:4.0, points:18, bio:"Young prospect." },
      { id:8, name:"Gatoch Panom", pos:"MID", club:"St. George", price:6.0, points:55, bio:"Creative midfielder." },
      { id:9, name:"Surafel Dagnachew", pos:"MID", club:"Fasil Kenema", price:6.5, points:61, bio:"Box-to-box engine." },
      { id:10, name:"Amanuel Yohannes", pos:"MID", club:"Ethiopia Bunna", price:6.0, points:48, bio:"Set-piece threat." },
      { id:11, name:"Canaan Markneh", pos:"MID", club:"Defense Force", price:5.5, points:39, bio:"Tidy passer." },
      { id:12, name:"Biniyam Fikre", pos:"MID", club:"Sidama Bunna", price:5.0, points:32, bio:"Good work rate." },
      { id:13, name:"Getaneh Kebede", pos:"FWD", club:"Wolkite", price:7.0, points:68, bio:"Prolific striker." },
      { id:14, name:"Abel Yalew", pos:"FWD", club:"Mechal", price:7.5, points:74, bio:"Clinical finisher." },
      { id:15, name:"Dawa Hotessa", pos:"FWD", club:"Adama City", price:6.5, points:52, bio:"Strong hold-up play." },
      { id:16, name:"Chernet Gugsa", pos:"FWD", club:"St. George", price:6.0, points:45, bio:"Pacy forward." }
    ];

    const SQUAD_RULES = { GK:2, DEF:5, MID:5, FWD:3 };
    const MAX_SQUAD = 15;
    const MAX_CLUB = 3;
    const BUDGET = 100.0;
    const HIT_COST = 4;
    const STORAGE_KEY = 'epl_version2_state';

    const defaultState = {
      activeTab: 'pick-team',
      squad: [1,2,3,4,5,6,8,9,10,11,12,13,14,15,16],
      captainId: 14,
      viceId: 9,
      marketFilter: 'All',
      marketSearch: '',
      pending: [],
      history: [],
      seenWelcome: false,
      gameweek: 1,
      transferPenalty: 0,
      freeTransfers: 1,
      transfersMade: 0,
      activeChip: null
    };

    const state = loadState();

    function loadState(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return JSON.parse(JSON.stringify(defaultState));
        const parsed = JSON.parse(raw);
        return Object.assign({}, defaultState, parsed);
      }catch{
        return JSON.parse(JSON.stringify(defaultState));
      }
    }

    function saveState(){
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }catch{}
    }

    function playerById(id){
      return PLAYERS.find(p => p.id === id);
    }

    function esc(str=''){
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function computeSquadValue(arr){
      let total = 0;
      arr.forEach(id => {
        const p = playerById(id);
        if (p) total += p.price;
      });
      return total;
    }

    function getSquadCounts(){
      const counts = { GK:0, DEF:0, MID:0, FWD:0 };
      state.squad.forEach(id => {
        const p = playerById(id);
        if (p) counts[p.pos] += 1;
      });
      return counts;
    }

    function setBankAndPenalty(){
      state.bank = Number((BUDGET - computeSquadValue(state.squad)).toFixed(1));
      const excess = Math.max(0, state.transfersMade - state.freeTransfers);
      state.transferPenalty = excess * HIT_COST;
    }

    function buildStartingXI(){
      const team = state.squad.map(playerById).filter(Boolean);
      if (!team.length) return [];

      const gk = team.filter(p => p.pos === 'GK').sort((a,b) => b.points - a.points);
      const def = team.filter(p => p.pos === 'DEF').sort((a,b) => b.points - a.points);
      const mid = team.filter(p => p.pos === 'MID').sort((a,b) => b.points - a.points);
      const fwd = team.filter(p => p.pos === 'FWD').sort((a,b) => b.points - a.points);

      const formations = [
        { def:3, mid:4, fwd:3 },
        { def:3, mid:5, fwd:2 },
        { def:4, mid:4, fwd:2 },
        { def:4, mid:3, fwd:3 },
        { def:5, mid:3, fwd:2 },
        { def:5, mid:4, fwd:1 }
      ];

      let best = { total:-Infinity, starters:[] };

      formations.forEach(form => {
        if (def.length < form.def || mid.length < form.mid || fwd.length < form.fwd) return;
        const starters = [gk[0], ...def.slice(0, form.def), ...mid.slice(0, form.mid), ...fwd.slice(0, form.fwd)];
        if (starters.length !== 11) return;
        const total = starters.reduce((sum,p)=>sum+p.points,0);
        if (total > best.total) best = { total, starters: starters.map(p=>p.id) };
      });

      if (best.total === -Infinity){
        const outfield = team.filter(p => p.pos !== 'GK').sort((a,b) => b.points - a.points);
        return [gk[0].id, ...outfield.slice(0,10).map(p=>p.id)];
      }

      return best.starters;
    }

    function canAddPlayer(player){
      if (state.squad.includes(player.id)) return { allowed:false, reason:'Already in squad' };
      if (state.squad.length >= MAX_SQUAD) return { allowed:false, reason:'Squad full' };
      if (state.bank < player.price) return { allowed:false, reason:'Not enough budget' };

      const samePos = state.squad.filter(id => playerById(id).pos === player.pos).length;
      if (samePos >= SQUAD_RULES[player.pos]) return { allowed:false, reason:`Max ${SQUAD_RULES[player.pos]} ${player.pos}` };

      const sameClub = state.squad.filter(id => playerById(id).club === player.club).length;
      if (sameClub >= MAX_CLUB) return { allowed:false, reason:`Max ${MAX_CLUB} from ${player.club}` };

      return { allowed:true };
    }

    function renderHeader(){
      const value = computeSquadValue(state.squad).toFixed(1);

      return `
        <div class="topbar">
          <div class="brand">
            <span>EPL Fantasy</span>
            <span class="gw-pill">GW ${state.gameweek}</span>
          </div>
          <div class="topstats">
            <div class="sticker">Bank <strong>Br ${state.bank.toFixed(1)}M</strong></div>
            <div class="sticker">Value <strong>Br ${value}M</strong></div>
            <div class="sticker">Transfers <strong>${state.freeTransfers} FT</strong></div>
            <div class="sticker">Hits <strong>${state.transferPenalty > 0 ? '-' + state.transferPenalty + ' pts' : '0 pts'}</strong></div>
            <button class="button primary" id="finalize-gw">Finalize GW</button>
          </div>
        </div>
      `;
    }

    function renderTabs(){
      return `
        <div class="tabs">
          <button class="tab-btn ${state.activeTab === 'pick-team' ? 'active' : ''}" data-tab="pick-team">My Team</button>
          <button class="tab-btn ${state.activeTab === 'transfers' ? 'active' : ''}" data-tab="transfers">Transfers</button>
          <button class="tab-btn ${state.activeTab === 'points' ? 'active' : ''}" data-tab="points">Points</button>
          <button class="tab-btn ${state.activeTab === 'rules' ? 'active' : ''}" data-tab="rules">Rules</button>
        </div>
      `;
    }

    function pitchCard(player){
      return `
        <div class="player-card">
          <div class="player-name">${esc(player.name)}</div>
          <div class="player-meta">${esc(player.pos)} • ${esc(player.club)}</div>
          <div class="player-actions">
            <button class="button" data-captain="${player.id}">Captain</button>
            <button class="button" data-vice="${player.id}">Vice</button>
            <button class="button" data-info="${player.id}">Info</button>
          </div>
        </div>
      `;
    }

    function emptyCards(count){
      return Array.from({length:count}, () => `<div class="player-card empty">Empty</div>`).join('');
    }

    function renderPitch(){
      const starters = buildStartingXI();
      const groups = { GK:[], DEF:[], MID:[], FWD:[] };
      starters.map(id => playerById(id)).filter(Boolean).forEach(p => groups[p.pos].push(p));

      const benchPlayers = state.squad.filter(id => !starters.includes(id)).map(id => {
        const p = playerById(id);
        return `<div class="bench-player">${esc(p.name)} • ${esc(p.pos)}</div>`;
      }).join('') || '<div class="bench-player">No bench players</div>';

      return `
        <div class="pitch-wrap">
          <div class="pitch-row">
            ${groups.GK.length ? groups.GK.map(pitchCard).join('') : emptyCards(1)}
          </div>
          <div class="pitch-row">
            ${groups.DEF.length ? groups.DEF.map(pitchCard).join('') : emptyCards(3)}
          </div>
          <div class="pitch-row">
            ${groups.MID.length ? groups.MID.map(pitchCard).join('') : emptyCards(4)}
          </div>
          <div class="pitch-row">
            ${groups.FWD.length ? groups.FWD.map(pitchCard).join('') : emptyCards(3)}
          </div>
          <div class="bench">${benchPlayers}</div>
        </div>
      `;
    }

    function renderSquadSummary(){
      const counts = getSquadCounts();
      return `
        <div class="panel">
          <h3 class="card-title">Squad Summary</h3>
          <div class="summary-row"><span>Squad Value</span><strong>Br ${computeSquadValue(state.squad).toFixed(1)}M</strong></div>
          <div class="summary-row"><span>Bank</span><strong>Br ${state.bank.toFixed(1)}M</strong></div>
          <div class="summary-row"><span>Players</span><strong>${state.squad.length}/15</strong></div>
          <div class="summary-row"><span>Free slots</span><strong>${MAX_SQUAD - state.squad.length}</strong></div>
          <div class="summary-row"><span>Captain</span><strong>${playerById(state.captainId)?.name || '-'}</strong></div>
          <div class="summary-row"><span>Vice</span><strong>${playerById(state.viceId)?.name || '-'}</strong></div>
          <div style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px;">
            <div class="summary-row"><span>GK</span><strong>${counts.GK}/2</strong></div>
            <div class="summary-row"><span>DEF</span><strong>${counts.DEF}/5</strong></div>
            <div class="summary-row"><span>MID</span><strong>${counts.MID}/5</strong></div>
            <div class="summary-row"><span>FWD</span><strong>${counts.FWD}/3</strong></div>
          </div>
        </div>
      `;
    }

    function renderSquadGrid(){
      const cards = state.squad.map(id => {
        const p = playerById(id);
        return `
          <div class="squad-card">
            <div style="display:flex;justify-content:space-between;gap:8px;">
              <div>
                <div style="font-weight:700;">${esc(p.name)}</div>
                <div style="color:var(--muted);font-size:0.75rem;">${esc(p.pos)} • ${esc(p.club)}</div>
              </div>
              <div style="font-weight:700;">${p.price}M</div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="button" data-info="${p.id}">Details</button>
              <button class="button" data-stage-sell="${p.id}">Sell</button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="panel">
          <h3 class="card-title">Your Squad</h3>
          <div class="squad-grid">${cards}</div>
        </div>
      `;
    }

    function renderTransfers(){
      const filtered = PLAYERS.filter(player => {
        const q = state.marketSearch.trim().toLowerCase();
        const posOk = state.marketFilter === 'All' ? true : player.pos === state.marketFilter;
        const searchOk = !q || player.name.toLowerCase().includes(q) || player.club.toLowerCase().includes(q) || player.pos.toLowerCase().includes(q);
        return posOk && searchOk;
      });

      const marketHtml = filtered.map(player => {
        const inSquad = state.squad.includes(player.id);
        const action = inSquad
          ? `<button class="button" data-stage-sell="${player.id}">Stage Sell</button>`
          : `<button class="button primary" data-stage-buy="${player.id}">Stage Buy</button>`;

        return `
          <div class="market-item">
            <div class="market-left">
              <div class="avatar">${esc(player.name.split(' ').map(s => s[0]).slice(0,2).join(''))}</div>
              <div>
                <div style="font-weight:700">${esc(player.name)}</div>
                <div style="color:var(--muted);font-size:0.8rem;">${esc(player.pos)} • ${esc(player.club)}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <div style="font-weight:700;">Br ${player.price}M</div>
              ${action}
              <button class="button" data-info="${player.id}">Info</button>
            </div>
          </div>
        `;
      }).join('');

      const pendingHtml = state.pending.map(item => {
        const p = playerById(item.playerId);
        const type = item.type === 'buy' ? 'Buy' : 'Sell';
        return `
          <div class="pending-item">
            <div>
              <div style="font-weight:700;">${type} ${esc(p.name)}</div>
              <div style="color:var(--muted);font-size:0.78rem;">Br ${p.price}M</div>
            </div>
            <button class="button" data-remove-pending="${item.id}">Undo</button>
          </div>
        `;
      }).join('') || '<div style="color:var(--muted)">No pending transfers</div>';

      return `
        <div class="panel">
          <h3 class="card-title">Transfer Market</h3>
          <div class="search-row">
            <input id="market-search" class="search" value="${esc(state.marketSearch)}" placeholder="Search player, club or position" />
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              ${['All','GK','DEF','MID','FWD'].map(filter => `
                <button class="filter-btn ${state.marketFilter === filter ? 'active' : ''}" data-filter="${filter}">${filter}</button>
              `).join('')}
            </div>
          </div>
          <div class="market-list">${marketHtml}</div>
        </div>

        <div class="panel" style="margin-top:12px;">
          <h3 class="card-title">Pending Transfers</h3>
          <div class="pending-list">${pendingHtml}</div>
          <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
            <button id="confirm-transfers" class="button primary">Confirm Transfers</button>
            <button id="clear-pending" class="button">Clear Pending</button>
          </div>
        </div>
      `;
    }

    function renderHistory(){
      return `
        <div class="panel">
          <h3 class="card-title">Gameweek History</h3>
          ${state.history.length ? state.history.map(item => `
            <div style="padding:10px 0;border-bottom:1px solid var(--line);">
              <div style="font-weight:700;">GW ${item.gw}</div>
              <div style="color:var(--muted);font-size:0.78rem;">Gross ${item.gross} • Hits -${item.hits} • Net ${item.net}</div>
            </div>
          `).join('') : '<div style="color:var(--muted)">No finalised gameweeks yet.</div>'}
        </div>
      `;
    }

    function renderRules(){
      return `
        <div class="panel">
          <h3 class="card-title">Rules</h3>
          <ul style="margin:0;padding-left:18px;line-height:1.8;color:var(--muted);">
            <li>Build a 15-player squad: 2 GK, 5 DEF, 5 MID, 3 FWD</li>
            <li>Budget: Br ${BUDGET}M</li>
            <li>Max 3 players from any one club</li>
            <li>1 free transfer per gameweek. Extra transfers cost -4 points each.</li>
            <li>Wildcards, free hits, triple captain and bench boost are available as chips.</li>
          </ul>
        </div>
      `;
    }

    function renderWelcome(){
      if (state.seenWelcome) return '';
      return `
        <div class="modal-overlay">
          <div class="modal">
            <div class="modal-head">
              <strong>Welcome to EPL Fantasy</strong>
              <button class="button" data-close-welcome>Close</button>
            </div>
            <div class="modal-body">
              <p style="margin:0 0 10px;">Build your squad, manage transfers, and chase the season.</p>
              <p style="margin:0;color:var(--muted);">Rules: 2 GK • 5 DEF • 5 MID • 3 FWD • Budget Br ${BUDGET}M</p>
            </div>
          </div>
        </div>
      `;
    }

    function render(){
      setBankAndPenalty();
      saveState();

      const root = document.getElementById('app');
      if (!root) return;

      let content = '';
      if (state.activeTab === 'pick-team'){
        const starters = buildStartingXI();
        content = `
          <div class="layout">
            <div>
              <div class="panel">
                <h3 class="card-title">My Team</h3>
                ${renderPitch()}
              </div>
              <div style="margin-top:12px;">
                ${renderSquadGrid()}
              </div>
            </div>
            <div>${renderSquadSummary()}</div>
          </div>
        `;
      } else if (state.activeTab === 'transfers'){
        content = `
          <div class="layout">
            <div>${renderTransfers()}</div>
            <div class="panel">
              <h3 class="card-title">Quick Summary</h3>
              <div class="summary-row"><span>Bank</span><strong>Br ${state.bank.toFixed(1)}M</strong></div>
              <div class="summary-row"><span>Pending</span><strong>${state.pending.length}</strong></div>
              <div class="summary-row"><span>Transfers Made</span><strong>${state.transfersMade}</strong></div>
            </div>
          </div>
        `;
      } else if (state.activeTab === 'points'){
        content = renderHistory();
      } else {
        content = renderRules();
      }

      root.innerHTML = `
        <div class="shell">
          ${renderHeader()}
          ${renderTabs()}
          <div class="content">${content}</div>
        </div>
        ${renderWelcome()}
      `;
    }

    function openPlayerModal(id){
      const player = playerById(id);
      if (!player) return;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <strong>${esc(player.name)}</strong>
            <button class="button" data-close-player>Close</button>
          </div>
          <div class="modal-body">
            <div style="color:var(--muted);font-size:0.8rem;">${esc(player.pos)} • ${esc(player.club)}</div>
            <div style="margin-top:10px;">${esc(player.bio)}</div>
            <div style="margin-top:12px;">Price: Br ${player.price}M</div>
            <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
              <button class="button" data-stage-buy="${player.id}">Stage Buy</button>
              <button class="button" data-stage-sell="${player.id}">Stage Sell</button>
            </div>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);

      overlay.addEventListener('click', (event) => {
        if (event.target === overlay || event.target.closest('[data-close-player]')) {
          overlay.remove();
        }
      });
    }

    function openFinaliseModal(){
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';

      modal.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <strong>Finalize Gameweek</strong>
            <button class="button" data-close-finalize>Close</button>
          </div>
          <div class="modal-body">
            <label style="display:block;margin-bottom:8px;color:var(--muted);">Paste JSON like {"1":{"minutes":90,"goals":1,"assists":1}}</label>
            <textarea id="gw-json">{ "1": { "minutes": 90, "goals": 1 }, "9": { "minutes": 90, "assists": 1 } }</textarea>
          </div>
          <div class="modal-actions">
            <button class="button primary" id="run-finalize">Run Finalize</button>
          </div>
        </div>
      `;

      document.body.appendChild(modal);

      modal.addEventListener('click', (event) => {
        if (event.target === modal || event.target.closest('[data-close-finalize]')) {
          modal.remove();
        }
      });

      modal.querySelector('#run-finalize').addEventListener('click', () => {
        try{
          const raw = modal.querySelector('#gw-json').value;
          const data = JSON.parse(raw);
          let gross = 0;

          for (const key in data){
            const id = Number(key);
            const p = playerById(id);
            if (!p) continue;
            const stats = data[key];
            let points = 0;

            if ((stats.minutes || 0) > 0) points += 1;
            if ((stats.minutes || 0) >= 60) points += 2;

            if ((stats.goals || 0) > 0){
              if (p.pos === 'GK') points += 10 * (stats.goals || 0);
              if (p.pos === 'DEF') points += 6 * (stats.goals || 0);
              if (p.pos === 'MID') points += 5 * (stats.goals || 0);
              if (p.pos === 'FWD') points += 4 * (stats.goals || 0);
            }

            if ((stats.assists || 0) > 0) points += 3 * (stats.assists || 0);
            gross += points;
          }

          const hits = state.transferPenalty || 0;
          const net = gross - hits;

          state.history.push({ gw: state.gameweek, gross, hits, net });
          state.gameweek += 1;
          state.pending = [];
          state.transferPenalty = 0;
          state.transfersMade = 0;
          saveState();
          modal.remove();
          render();
          alert(`Gameweek finalized: Gross ${gross} • Hits -${hits} • Net ${net}`);
        }catch{
          alert('Invalid JSON. Use an object like {"1":{"minutes":90,"goals":1}}');
        }
      });
    }

    document.addEventListener('click', (event) => {
      const tabBtn = event.target.closest('.tab-btn');
      if (tabBtn) {
        state.activeTab = tabBtn.dataset.tab;
        render();
        return;
      }

      const welcomeClose = event.target.closest('[data-close-welcome]');
      if (welcomeClose) {
        state.seenWelcome = true;
        saveState();
        render();
        return;
      }

      const finaliseBtn = event.target.closest('#finalize-gw');
      if (finaliseBtn) {
        openFinaliseModal();
        return;
      }

      const captainBtn = event.target.closest('[data-captain]');
      if (captainBtn) {
        const id = Number(captainBtn.dataset.captain);
        state.captainId = id;
        saveState();
        render();
        return;
      }

      const viceBtn = event.target.closest('[data-vice]');
      if (viceBtn) {
        const id = Number(viceBtn.dataset.vice);
        state.viceId = id;
        saveState();
        render();
        return;
      }

      const infoBtn = event.target.closest('[data-info]');
      if (infoBtn) {
        openPlayerModal(Number(infoBtn.dataset.info));
        return;
      }

      const stageBuyBtn = event.target.closest('[data-stage-buy]');
      if (stageBuyBtn) {
        const id = Number(stageBuyBtn.dataset.stageBuy);
        const player = playerById(id);
        if (!player) return;
        const ok = canAddPlayer(player);
        if (!ok.allowed) {
          alert(ok.reason);
          return;
        }
        state.pending.push({ id: Date.now() + Math.random(), type:'buy', playerId:id });
        saveState();
        render();
        return;
      }

      const stageSellBtn = event.target.closest('[data-stage-sell]');
      if (stageSellBtn) {
        const id = Number(stageSellBtn.dataset.stageSell);
        if (!state.squad.includes(id)) return;
        if (!state.pending.some(item => item.type === 'sell' && item.playerId === id)) {
          state.pending.push({ id: Date.now() + Math.random(), type:'sell', playerId:id });
        }
        saveState();
        render();
        return;
      }

      const removePendingBtn = event.target.closest('[data-remove-pending]');
      if (removePendingBtn) {
        const id = Number(removePendingBtn.dataset.removePending);
        state.pending = state.pending.filter(item => item.id !== id);
        saveState();
        render();
        return;
      }

      const confirmTransfersBtn = event.target.closest('#confirm-transfers');
      if (confirmTransfersBtn) {
        const buys = state.pending.filter(item => item.type === 'buy').map(item => item.playerId);
        const sells = state.pending.filter(item => item.type === 'sell').map(item => item.playerId);

        state.squad = state.squad.filter(id => !sells.includes(id));

        buys.forEach(id => {
          if (!state.squad.includes(id) && state.squad.length < MAX_SQUAD) {
            state.squad.push(id);
          }
        });

        state.pending = [];
        state.transfersMade += buys.length + sells.length;
        saveState();
        render();
        return;
      }

      const clearPendingBtn = event.target.closest('#clear-pending');
      if (clearPendingBtn) {
        state.pending = [];
        saveState();
        render();
        return;
      }

      const filterBtn = event.target.closest('[data-filter]');
      if (filterBtn) {
        state.marketFilter = filterBtn.dataset.filter;
        saveState();
        render();
        return;
      }
    });

    document.addEventListener('input', (event) => {
      if (event.target.id === 'market-search') {
        state.marketSearch = event.target.value;
        render();
      }
    });

    render();
  </script>
</body>
</html>
